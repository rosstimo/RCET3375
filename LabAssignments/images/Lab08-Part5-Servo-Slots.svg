<text x="22" y="62" fill="#475569" font-size="15">One 20 ms Timer1 frame   ·   2.5 ms per slot   ·   illustrative pulse widths</text>
<text x="82" y="124" text-anchor="end" fill="#334155" font-size="14">Slot</text>
<text x="82" y="180" text-anchor="end" fill="#334155" font-size="14">Pulse</text>
<text x="82" y="271" text-anchor="end" fill="#334155" font-size="14">Work</text>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="388" viewBox="0 0 1200 388" role="img" aria-labelledby="title desc">
<title id="title">Eight staggered 2.5 ms servo time slots with 128 microsecond protected windows</title>
<desc id="desc">Eight servo pulses of different widths share one 20 millisecond timeline. Each green pulse starts at its own slot boundary; a thin red band marks the final 128 microseconds before each falling edge, when servo_busy blocks foreground servicing. A second shared foreground work timeline is green everywhere except at those same eight red windows. Foreground UART and ADC services can run during green regions, including most of a high servo pulse.</desc>

  <title id="title">I2C pull-up RC charging curve and 30 to 70 percent rise time</title>
  <desc id="description">Exponential bus voltage rise after an open-drain release. Horizontal lines mark 30 and 70 percent of the supply. The time between their crossings is 0.8473 times the RC time constant.</desc>
